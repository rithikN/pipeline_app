default:
  KITSU_BASE_URL: "https://kitsu.example.com/api"
  KITSU_TIMEOUT: 15
  ASSET_SERVER_BASE: "hlm:/Heirloom_Server/Assets"
  PIPELINE_DEBUG: false
  RCLONE_PATHS:
    Windows:
      - "C:/tools/rclone/rclone.exe"
    Darwin:
      - "/usr/local/bin/rclone"
  THUMBNAIL_PATH:
    Windows: "win_thumbnail"
    Darwin: "mac_thumbnail"

local:
  KITSU_BASE_URL: "http://localhost:5000/api"
  PIPELINE_DEBUG: true
  ASSET_SERVER_BASE: "local:/tmp/assets"

studio:
  KITSU_BASE_URL: "https://kitsu-studio.example.com/api"
  ASSET_SERVER_BASE: "studio:/mnt/assets"

cloud:
  KITSU_BASE_URL: "https://kitsu-cloud.example.com/api"
  ASSET_SERVER_BASE: "s3:/bucket/assets"

